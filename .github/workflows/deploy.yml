name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
          # NEXT_PUBLIC_* değerleri tarayıcı paketine zaten gömülür; anon key herkese açık olacak şekilde tasarlanmıştır.
          NEXT_PUBLIC_SUPABASE_URL: https://phhpcnxrjnpgcscpwhzu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoaHBjbnhyam5wZ2NzY3B3aHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjAwNDYsImV4cCI6MjA5NjIzNjA0Nn0.DsEbve_Wxtn408--zwSbTQgvRuzd9Xy9eq1rIGsGvsk
          NEXT_PUBLIC_SITE_URL: https://vlknberkan-lang.github.io/nisan_ani
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
